# Global Experimental Protocol Configuration for RISC-Mal Continual Benchmark
experiment:
  title: "Class-Incremental Windows Malware Detection"
  seed: 42
  device: "cuda" # Automatically falls back to "cpu" if CUDA is unavailable
  results_dir: "results"

data:
  num_tasks: 3
  classes_per_task: 2
  total_classes: 6
  batch_size: 32
  num_workers: 0
  purge_cross_split_leakage: true

training:
  epochs_per_task: 10
  optimizer: "adam"
  learning_rate: 0.0001
  weight_decay: 0.0

memory:
  replay_ratio: 0.10 # Retain rho = 10% samples per class
  min_per_class: 1
  mixed_batch_size: 64 # 32 current task samples + 32 replayed exemplars
